spring.application.name=backend_novo
# ======================================================
#  CONFIGURACIÓN DE BASE DE DATOS (PostgreSQL)
# ======================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/centro_novo_db
spring.datasource.username=postgres
spring.datasource.password=4636
spring.datasource.driver-class-name=org.postgresql.Driver

# ======================================================
#  JPA (Hibernate) - Configuración inicial
# ======================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ======================================================
#  FLYWAY (Migraciones)
# ======================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# Ubicación por defecto de los scripts: src/main/resources/db/migration/
spring.flyway.locations=classpath:db/migration
# Si la base de datos ya tiene tablas, no las borra, solo agrega migraciones pendientes
spring.flyway.validate-on-migrate=true
